name: Fetch Fish Thumbnails
on:
  workflow_dispatch:
  push:
    paths:
      - 'fish_database.json'

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - run: pip install requests
      - run: |
          python3 << 'EOF'
          import json, requests, time

          with open("fish_database.json") as f:
              db = json.load(f)

          result = {}
          items = [(fid, d) for fid, d in db.items() if d.get("iconId")]
          batches = [items[i:i+100] for i in range(0, len(items), 100)]

          for batch in batches:
              ids = ",".join([d["iconId"] for _, d in batch])
              url = f"https://thumbnails.roblox.com/v1/assets?assetIds={ids}&size=420x420&format=Png"
              try:
                  resp = requests.get(url, timeout=10).json()
                  url_map = {str(x["targetId"]): x["imageUrl"] for x in resp.get("data", []) if x.get("state") == "Completed"}
              except:
                  url_map = {}
              for fid, d in batch:
                  result[fid] = {**d, "imageUrl": url_map.get(d["iconId"], "")}
              time.sleep(0.3)

          # Tambah yang iconId kosong
          for fid, d in db.items():
              if not d.get("iconId"):
                  result[fid] = {**d, "imageUrl": ""}

          with open("fish_icons.json", "w") as f:
              json.dump(result, f, indent=2)
          print(f"Done: {sum(1 for v in result.values() if v.get('imageUrl'))}/{len(result)}")
          EOF
      - run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}
          git add fish_icons.json
          git commit -m "Auto-fetch thumbnails" || echo "No changes"
          git push
